<!DOCTYPE html>
<html lang="en">
<head>
  <title>Display popup on marker click</title>
  <meta
    property="og:description"
    content="Click a marker to toggle its popup. Only one popup is visible at a time."
  />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    html, body, #map { height: 100%; }
    .maplibregl-popup {
      max-width: 400px;
      font: 12px/20px "Helvetica Neue", Arial, Helvetica, sans-serif;
      pointer-events: none;
    }
    .maplibregl-popup-content,
    .maplibregl-popup-content * {
      pointer-events: auto;
    }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/bright',
    center: [-77.04, 38.907],
    zoom: 11.15
  });

  map.on('load', async () => {
    const image = await map.loadImage('https://maplibre.org/maplibre-gl-js/docs/assets/custom_marker.png');
    map.addImage('custom-marker', image.data);

    map.addSource('places', {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: [
          {
            type: 'Feature',
            properties: {
              description: '<strong>Make it Mount Pleasant</strong><p>Make it Mount Pleasant is a handmade and vintage market and afternoon of live entertainment and kids activities. 12:00-6:00 p.m.</p>'
            },
            geometry: { type: 'Point', coordinates: [-77.038659, 38.931567] }
          },
          {
            type: 'Feature',
            properties: {
              description: '<strong>Mad Men Season Five Finale Watch Party</strong><p>Head to Lounge 201 (201 Massachusetts Avenue NE) Sunday for a Mad Men Season Five Finale Watch Party, complete with 60s costume contest, Mad Men trivia, and retro food and drink. 8:00-11:00 p.m. $10 general admission, $20 admission and two hour open bar.</p>'
            },
            geometry: { type: 'Point', coordinates: [-77.003168, 38.894651] }
          },
          {
            type: 'Feature',
            properties: {
              description: '<strong>Big Backyard Beach Bash and Wine Fest</strong><p>EatBar (2761 Washington Boulevard Arlington VA) is throwing a Big Backyard Beach Bash and Wine Fest on Saturday, serving up conch fritters, fish tacos and crab sliders, and Red Apron hot dogs. 12:00-3:00 p.m. $25.</p>'
            },
            geometry: { type: 'Point', coordinates: [-77.090372, 38.881189] }
          },
          {
            type: 'Feature',
            properties: {
              description: '<strong>Ballston Arts & Crafts Market</strong><p>The Ballston Arts & Crafts Market sets up shop next to the Ballston metro this Saturday for the first of five dates this summer. Nearly 35 artists and crafters will be on hand selling their wares. 10:00-4:00 p.m.</p>'
            },
            geometry: { type: 'Point', coordinates: [-77.111561, 38.882342] }
          },
          {
            type: 'Feature',
            properties: {
              description: '<strong>Seersucker Bike Ride and Social</strong><p>Feeling dandy? Get fancy, grab your bike, and take part in this year\'s Seersucker Social bike ride from Dandies and Quaintrelles. After the ride enjoy a lawn party at Hillwood with jazz, cocktails, paper hat-making, and more. 11:00-7:00 p.m.</p>'
            },
            geometry: { type: 'Point', coordinates: [-77.052477, 38.943951] }
          },
          {
            type: 'Feature',
            properties: {
              description: '<strong>Capital Pride Parade</strong><p>The annual Capital Pride Parade makes its way through Dupont this Saturday. 4:30 p.m. Free.</p>'
            },
            geometry: { type: 'Point', coordinates: [-77.043444, 38.909664] }
          },
          {
            type: 'Feature',
            properties: {
              description: '<strong>Muhsinah</strong><p>Jazz-influenced hip hop artist Muhsinah plays the Black Cat (1811 14th Street NW) tonight with Exit Clov and Gods\'illa. 9:00 p.m. $12.</p>'
            },
            geometry: { type: 'Point', coordinates: [-77.031706, 38.914581] }
          },
          {
            type: 'Feature',
            properties: {
              description: '<strong>A Little Night Music</strong><p>The Arlington Players\' production of Stephen Sondheim\'s <em>A Little Night Music</em> comes to the Kogod Cradle at The Mead Center for American Theater (1101 6th Street SW) this weekend and next. 8:00 p.m.</p>'
            },
            geometry: { type: 'Point', coordinates: [-77.020945, 38.878241] }
          },
          {
            type: 'Feature',
            properties: {
              description: '<strong>Truckeroo</strong><p>Truckeroo brings dozens of food trucks, live music, and games to half and M Street SE (across from Navy Yard Metro Station) today from 11:00 a.m. to 11:00 p.m.</p>'
            },
            geometry: { type: 'Point', coordinates: [-77.007481, 38.876516] }
          }
        ]
      }
    });

    map.addLayer({
      id: 'places',
      type: 'symbol',
      source: 'places',
      layout: {
        'icon-image': 'custom-marker',
        'icon-overlap': 'always'
      }
    });

    const popup = new maplibregl.Popup({
      closeButton: false,
      closeOnClick: false
    });

    let activePopupKey;
    let skipNextMapClose = false;
    let popupContentEl;

    function attachPopupClickGuard() {
      const popupEl = popup.getElement?.();
      if (!(popupEl instanceof HTMLElement)) {
        return;
      }
      const contentEl = popupEl.querySelector('.maplibregl-popup-content');
      if (!(contentEl instanceof HTMLElement) || popupContentEl === contentEl) {
        return;
      }
      if (popupContentEl) {
        popupContentEl.removeEventListener('click', stopPopupClick);
      }
      contentEl.addEventListener('click', stopPopupClick);
      popupContentEl = contentEl;
    }

    function detachPopupClickGuard() {
      if (!popupContentEl) {
        return;
      }
      popupContentEl.removeEventListener('click', stopPopupClick);
      popupContentEl = undefined;
    }

    function stopPopupClick(event) {
      event.stopPropagation();
    }

    function getWrappedCoordinates(eventLngLat, feature) {
      const coordinates = feature.geometry.coordinates.slice();
      while (Math.abs(eventLngLat.lng - coordinates[0]) > 180) {
        coordinates[0] += eventLngLat.lng > coordinates[0] ? 360 : -360;
      }
      return coordinates;
    }

    map.on('click', 'places', (e) => {
      skipNextMapClose = true;
      window.setTimeout(() => {
        skipNextMapClose = false;
      }, 0);
      const feature = e.features?.[0];
      if (!feature) {
        return;
      }

      const coordinates = getWrappedCoordinates(e.lngLat, feature);
      const description = feature.properties?.description || '';
      const popupKey = `${feature.id ?? 'noid'}|${coordinates[0].toFixed(6)},${coordinates[1].toFixed(6)}`;

      if (popup.isOpen() && activePopupKey === popupKey) {
        popup.remove();
        detachPopupClickGuard();
        activePopupKey = undefined;
        map.getCanvas().style.cursor = '';
        return;
      }

      map.getCanvas().style.cursor = 'pointer';
      popup.setLngLat(coordinates).setHTML(description).addTo(map);
      attachPopupClickGuard();
      activePopupKey = popupKey;
    });

    map.on('click', (e) => {
      if (skipNextMapClose) {
        skipNextMapClose = false;
        return;
      }
      const target = e?.originalEvent?.target;
      if (popupContentEl && target instanceof Node && popupContentEl.contains(target)) {
        return;
      }
      const features = map.queryRenderedFeatures(e.point, { layers: ['places'] });
      if (features.length > 0) {
        return;
      }
      popup.remove();
      detachPopupClickGuard();
      activePopupKey = undefined;
      map.getCanvas().style.cursor = '';
    });
  });
</script>
</body>
</html>
